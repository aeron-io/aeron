plugins {
    id 'aeron.java-conventions'
    id 'aeron.publishing'
    id 'aeron.config-info'
}

configurations{
    codecGeneration
}

dependencies {
    api project(':aeron-driver')
    codecGeneration libs.sbe
    implementation project(':aeron-annotations')
    annotationProcessor project(':aeron-annotations')
    testImplementation project(':aeron-test-support')
    javadocSource project(':aeron-annotations')
    javadocSource project(':aeron-client')
    javadocSource project(':aeron-driver')
}

def generatedSrcDir = file("${layout.buildDirectory.get()}/generated-src")

tasks.withType(Test).configureEach {
    systemProperty 'aeron.event.archive.log', 'all'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.test.agent.CountingEventReaderAgent'
}

LoggingTest.configureLoggingTests(project, 'ArchiveEventEnablementTest', 'aeron.event.archive.log',
    'aeron.event.archive.log.disable', 'CATALOG_RESIZE,CMD_IN_AUTH_CONNECT')

def codecsFile = 'src/main/resources/archive/aeron-archive-codecs.xml'
def markCodecsFile = 'src/main/resources/archive/aeron-archive-mark-codecs.xml'
def sbeFile = 'src/main/resources/archive/fpl/sbe.xsd'

tasks.register('generateCodecs', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile, markCodecsFile)
    validationXsd = file(sbeFile)
    outputDir = generatedSrcDir
    targetLanguage = 'Java'
}

def generatedCppDir = file(System.getProperty('codec.target.dir') ?: "${rootDir}/cppbuild/Release/generated")
tasks.register('generateCppCodecs', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile)
    validationXsd = file(sbeFile)
    outputDir = generatedCppDir
    targetLanguage = 'Cpp'
    targetNamespace = 'aeron.archive.client'
}

def generatedCDir = file(System.getProperty('codec.target.dir') ?: "${rootDir}/cppbuild/Release/generated/c")
tasks.register('generateCCodecs', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile)
    validationXsd = file(sbeFile)
    outputDir = generatedCDir
    targetLanguage = 'C'
    targetNamespace = 'aeron.archive.client'
}

tasks.register('generateTestCodecsV6', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile)
    validationXsd = file(sbeFile)
    outputDir = layout.buildDirectory.dir('generated-test/generateTestCodecsV6')
    targetLanguage = 'Java'
    targetNamespace = 'io.aeron.archive.codecs.v6'
    schemaTransformVersion = '*:6'
}

tasks.register('generateTestCodecsMarkFileV0', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(markCodecsFile)
    validationXsd = file(sbeFile)
    outputDir = layout.buildDirectory.dir('generated-test/generateTestCodecsMarkFileV0')
    targetLanguage = 'Java'
    targetNamespace = 'io.aeron.archive.codecs.mark.v0'
    schemaTransformVersion = '*:0'
}

tasks.register('generateTestCodecsMarkFileV1', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(markCodecsFile)
    validationXsd = file(sbeFile)
    outputDir = layout.buildDirectory.dir('generated-test/generateTestCodecsMarkFileV1')
    targetLanguage = 'Java'
    targetNamespace = 'io.aeron.archive.codecs.mark.v1'
    schemaTransformVersion = '*:1'
}

// The generated codecs are compiled separately from the module's own sources: with --parallel they compile while
// upstream modules are still compiling, and edits to hand-written code don't recompile them.
sourceSets {
    generated {
        java.srcDir(tasks.named('generateCodecs'))
        compileClasspath += configurations.codecGeneration
    }
}

dependencies {
    api files(sourceSets.generated.output)
}

// Projects aggregating this module's sources (Javadoc, the aeron-all sources jar) need the codecs too.
configurations.named('mainSourceElements') {
    outgoing.artifact(tasks.named('generateCodecs').flatMap { it.outputDir }) {
        type = 'directory'
    }
}
// The versioned test codecs are compiled with the module's tests.
sourceSets.test.java.srcDir(tasks.named('generateTestCodecsV6'))
sourceSets.test.java.srcDir(tasks.named('generateTestCodecsMarkFileV0'))
sourceSets.test.java.srcDir(tasks.named('generateTestCodecsMarkFileV1'))

jar {
    from sourceSets.generated.output

    manifest.attributes(
        'Automatic-Module-Name': 'io.aeron.archive',
        'Implementation-Title': 'Aeron',
        'Implementation-Vendor': 'Adaptive Financial Consulting Limited',
        'Implementation-Version': project.version
    )
}

javadoc {
    source += sourceSets.generated.allJava
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('sourcesJar') {
    from sourceSets.generated.allSource
}

// aeron-system-tests uses a few of archive's test helpers, so the test classes are shared through this configuration.
def testJar = tasks.register('testJar', Jar) {
    archiveClassifier.set(base.archivesName.map { "test-${it}" })
    from sourceSets.test.output
}

configurations.consumable('tests') {
    outgoing.artifact(testJar)
}

publishing {
    publications {
        aeronArchive(MavenPublication) {
            from components.java
        }
    }
}
