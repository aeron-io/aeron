plugins {
    id 'aeron.java-conventions'
    id 'aeron.publishing'
    id 'aeron.config-info'
    id 'application'
}

aeronConfigInfo.validateConfigExpectations()

application {
    mainClass.set('io.aeron.driver.MediaDriver')
}

dependencies {
    api project(':aeron-client')
    implementation project(':aeron-annotations')
    annotationProcessor project(':aeron-annotations')
    testImplementation project(':aeron-test-support')
    javadocSource project(':aeron-annotations')
    javadocSource project(':aeron-client')
}

jar {
    manifest.attributes(
        'Automatic-Module-Name': 'io.aeron.driver',
        'Implementation-Title': 'Aeron',
        'Implementation-Vendor': 'Adaptive Financial Consulting Limited',
        'Implementation-Version': project.version
    )
}

jar.finalizedBy assembleDist

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.withType(Test).configureEach {
    systemProperty 'aeron.event.log', 'all'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.test.agent.CountingEventReaderAgent'
}

LoggingTest.configureLoggingTests(
    project, 'DriverEventEnablementTest', 'aeron.event.log', 'aeron.event.log.disable',
    'TEXT_DATA,CMD_IN_ADD_PUBLICATION')

publishing {
    publications {
        aeronDriver(MavenPublication) {
            from components.java
            artifact distZip
            artifact distTar
        }
    }
}

tasks.withType(Test).configureEach {
    systemProperty 'aeron.event.log', 'all'
}
