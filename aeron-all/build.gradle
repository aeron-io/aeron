plugins {
    id 'aeron.java-conventions'
    id 'aeron.publishing'
    id 'com.gradleup.shadow'
}

// Projects whose main sources are bundled into the aeron-all sources jar.
configurations.dependencyScope('bundledSource')
configurations.resolvable('bundledSourcePath') {
    extendsFrom(configurations.bundledSource)
    MainSourcesVariant.request(it, objects)
}

dependencies {
    implementation project(':aeron-cluster')
    implementation project(':aeron-samples')
    javadocSource project(':aeron-annotations')
    javadocSource project(':aeron-client')
    javadocSource project(':aeron-driver')
    javadocSource project(':aeron-archive')
    javadocSource project(':aeron-cluster')
    javadocSource project(':aeron-samples')
    bundledSource project(':aeron-client')
    bundledSource project(':aeron-driver')
    bundledSource project(':aeron-archive')
    bundledSource project(':aeron-cluster')
    bundledSource project(':aeron-samples')
}

shadowJar {
    archiveClassifier.set('')

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // exclude duplicate files by default

    mergeServiceFiles('META-INF/services') // merge service files into a single file
    filesMatching('META-INF/services/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE // copy all services across
    }

    manifest.attributes(
        'Automatic-Module-Name': 'io.aeron.all',
        'Implementation-Title': 'Aeron',
        'Implementation-Vendor': 'Adaptive Financial Consulting Limited',
        'Implementation-Version': project.version
    )

    relocate 'org.HdrHistogram', 'io.aeron.shadow.org.HdrHistogram'
}

jar.finalizedBy shadowJar

tasks.register('sourcesJar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // exclude duplicate files by default
    archiveClassifier.set('sources')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // exclude duplicate files by default
    from configurations.bundledSourcePath.incoming.files
}

tasks.register('javadocJar', Jar) {
    dependsOn 'javadoc'
    archiveClassifier.set('javadoc')
    from javadoc.destinationDir
}

publishing {
    publications {
        aeronAll(MavenPublication) {
            artifact shadowJar
            artifact sourcesJar
            artifact javadocJar
        }
    }
}
