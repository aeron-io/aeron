plugins {
    id 'aeron.java-conventions'
    id 'aeron.publishing'
    id 'aeron.config-info'
}

configurations{
    codecGeneration
}

dependencies {
    api project(':aeron-archive')
    codecGeneration libs.sbe
    implementation project(':aeron-annotations')
    annotationProcessor project(':aeron-annotations')
    testImplementation project(':aeron-test-support')
    testImplementation libs.jackson.cbor
    javadocSource project(':aeron-annotations')
    javadocSource project(':aeron-client')
    javadocSource project(':aeron-driver')
    javadocSource project(':aeron-archive')
}

def generatedSrcDir = file("${layout.buildDirectory.get()}/generated-src")

tasks.withType(Test).configureEach {
    systemProperty 'aeron.event.cluster.log', 'all'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.test.agent.CountingEventReaderAgent'
}

LoggingTest.configureLoggingTests(project, 'ClusterEventEnablementTest', 'aeron.event.cluster.log',
    'aeron.event.cluster.log.disable', 'CANVASS_POSITION,COMMIT_POSITION')

def codecsFile = 'src/main/resources/cluster/aeron-cluster-codecs.xml'
def markCodecsFile = 'src/main/resources/cluster/aeron-cluster-mark-codecs.xml'
def nodeStateCodecsFile = 'src/main/resources/cluster/aeron-cluster-node-state-codecs.xml'
def sbeFile = 'src/main/resources/cluster/fpl/sbe.xsd'

tasks.register('generateCodecs', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile, markCodecsFile, nodeStateCodecsFile)
    validationXsd = file(sbeFile)
    outputDir = generatedSrcDir
    targetLanguage = 'Java'
}

def markCodecsFileV0 = 'src/test/resources/aeron-cluster-mark-codecs-v0.xml'
tasks.register('generateTestCodecsMarkFileV0', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(markCodecsFileV0)
    validationXsd = file(sbeFile)
    outputDir = layout.buildDirectory.dir('generated-test/generateTestCodecsMarkFileV0')
    targetLanguage = 'Java'
    targetNamespace = 'io.aeron.cluster.codecs.mark.v0'
    schemaTransformVersion = '*:0'
}

tasks.register('generateTestCodecsV5', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile)
    validationXsd = file(sbeFile)
    outputDir = layout.buildDirectory.dir('generated-test/generateTestCodecsV5')
    targetLanguage = 'Java'
    targetNamespace = 'io.aeron.cluster.codecs.v5'
    schemaTransformVersion = '*:5'
}

tasks.register('generateTestCodecsV12', SbeGenerateTask) {
    classpath = configurations.codecGeneration
    schemas.from(codecsFile)
    validationXsd = file(sbeFile)
    outputDir = layout.buildDirectory.dir('generated-test/generateTestCodecsV12')
    targetLanguage = 'Java'
    targetNamespace = 'io.aeron.cluster.codecs.v12'
    schemaTransformVersion = '*:12'
}

// The generated codecs are compiled separately from the module's own sources: with --parallel they compile while
// upstream modules are still compiling, and edits to hand-written code don't recompile them.
sourceSets {
    generated {
        java.srcDir(tasks.named('generateCodecs'))
        compileClasspath += configurations.codecGeneration
    }
}

dependencies {
    api files(sourceSets.generated.output)
}

// Projects aggregating this module's sources (Javadoc, the aeron-all sources jar) need the codecs too.
configurations.named('mainSourceElements') {
    outgoing.artifact(tasks.named('generateCodecs').flatMap { it.outputDir }) {
        type = 'directory'
    }
}
// The versioned test codecs are compiled with the module's tests.
sourceSets.test.java.srcDir(tasks.named('generateTestCodecsMarkFileV0'))
sourceSets.test.java.srcDir(tasks.named('generateTestCodecsV5'))
sourceSets.test.java.srcDir(tasks.named('generateTestCodecsV12'))

jar {
    from sourceSets.generated.output

    manifest.attributes(
        'Automatic-Module-Name': 'io.aeron.cluster',
        'Implementation-Title': 'Aeron',
        'Implementation-Vendor': 'Adaptive Financial Consulting Limited',
        'Implementation-Version': project.version
    )
}

javadoc {
    source += sourceSets.generated.allJava
}

java {
    withSourcesJar()
    withJavadocJar()
}

tasks.named('sourcesJar') {
    from sourceSets.generated.allSource
}

publishing {
    publications {
        aeronCluster(MavenPublication) {
            from components.java
        }
    }
}
