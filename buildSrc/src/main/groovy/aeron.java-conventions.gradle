import io.aeron.build.AeronVersionArgumentProvider
import io.aeron.build.BuildJavaVersion
import io.aeron.build.GitShaService

// Shared Java compilation, jar and Checkstyle configuration for every Aeron module. Tests and Javadoc are configured by
// aeron.test-conventions and aeron.javadoc-conventions, which apply this plugin.
plugins {
    id 'java-library'
    id 'checkstyle'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')
int buildJavaVersion = BuildJavaVersion.major()
def aeronVersion = providers.provider { project.version.toString() }
def gitSha = GitShaService.gitSha(project)

checkstyle.toolVersion = libs.findVersion('checkstyle').get().requiredVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(buildJavaVersion)
    }
    sourceCompatibility = JavaVersion.VERSION_17
}

tasks.withType(Jar).configureEach {
    includeEmptyDirs = false
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.deprecation = true
    options.release = java.sourceCompatibility.majorVersion.toInteger()
    options.compilerArgs.addAll(['-Xlint:all,-processing', '-Werror', '-parameters']) // Enable all warnings and treat them as errors
    options.compilerArgumentProviders.add(new AeronVersionArgumentProvider(aeronVersion, gitSha))
}

// Gradle's mainSourceElements variant lists main's source directories but not the tasks that generate them (e.g.
// generateCodecs), so other projects aggregating these sources would read generated directories before they exist.
configurations.named('mainSourceElements') {
    outgoing.artifacts.configureEach { it.builtBy(sourceSets.main.allSource.sourceDirectories) }
}
