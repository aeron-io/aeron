import io.aeron.build.BuildJavaVersion
import io.aeron.build.TestExecutionLimitService

// Shared test configuration for every Aeron module: JUnit, the test JVM and its system properties, the slowTest,
// bindingsTest and topologyTest tasks, and the test jar.
plugins {
    id 'aeron.java-conventions'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')
int buildJavaVersion = BuildJavaVersion.major()
def toolchainLauncher = javaToolchains.launcherFor {
    languageVersion = JavaLanguageVersion.of(buildJavaVersion)
}

// Run one test task at a time across the whole build, as Gradle did before tasks ran in parallel: the tests start media
// drivers and share Aeron directories and ports. Raise maxParallelUsages only once tests are known to be safe together.
def testExecutionLimit = gradle.sharedServices.registerIfAbsent('aeronTestExecutionLimit', TestExecutionLimitService) {
    maxParallelUsages = 1
}

dependencies {
    testImplementation libs.findLibrary('hamcrest').get()
    testImplementation libs.findLibrary('mockito').get()
    testImplementation platform(libs.findLibrary('junit-bom').get())
    testImplementation "org.junit.jupiter:junit-jupiter-params"
    testRuntimeOnly "org.junit.jupiter:junit-jupiter-engine"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def mockitoAgent = configurations.create('mockitoAgent') { transitive = false }
mockitoAgent.withDependencies {it.add(libs.findLibrary('mockito').get().get()) }

// Resolve these at project-configuration time, outside configureEach
def testSuiteClassesDirs = testing.suites.test.sources.output.classesDirs
def testSuiteClasspath = testing.suites.test.sources.runtimeClasspath

tasks.withType(Test).configureEach { test ->
    usesService(testExecutionLimit)

    // With a native media driver or ATS binary set, tests run against that binary, but only its path is an input.
    // A rebuilt binary at the same path would get a cached result, so don't cache those runs.
    def externalBinaryPaths = [
        System.getProperty('aeron.test.system.aeronmd.path'),
        System.getProperty('aeron.test.system.ats.path')]
    outputs.doNotCacheIf('tests run against an external native binary that is not tracked as an input') {
        externalBinaryPaths.any { it != null }
    }
    jvmArgs('--add-opens', 'java.base/jdk.internal.misc=ALL-UNNAMED')
    jvmArgs('--add-opens', 'java.base/java.util.zip=ALL-UNNAMED')
    if (buildJavaVersion >= 21) {
        jvmArgs('-XX:+EnableDynamicAgentLoading')
    }

    // A C media driver launched by the tests inherits the environment, so an AERON_* change must rerun them.
    inputs.property('aeronEnvironment', providers.environmentVariablesPrefixedBy('AERON_'))

    testClassesDirs = testSuiteClassesDirs
    classpath = testSuiteClasspath

    def baseLogFileName = "${layout.buildDirectory.get()}/${layout.projectDirectory.asFile.getName()}-${test.name}-%p"
    jvmArgs("-XX:MaxDirectMemorySize=2g",
            "-Xms2048m",
            "-Xmx2048m",
            "-Xmn1536m",
            "-XX:+CreateCoredumpOnCrash",
            "-XX:+HeapDumpOnOutOfMemoryError",
            "-XX:+CrashOnOutOfMemoryError",
            "-XX:HeapDumpPath=${baseLogFileName}-heap.hprof",
            "-XX:+UseParallelGC",
            "-Xlog:gc*,safepoint=info,arguments=info:file=${baseLogFileName}-gc.log:time",
            "-XX:ErrorFile=${baseLogFileName}-crash.log",
            "-Xshare:off")

    useJUnitPlatform {
        if (test.name != 'slowTest' && test.name != 'bindingsTest'
                && test.name != 'topologyTest' && !test.name.startsWith('loggingTest'))
        {
            excludeTags 'any()'
        }
    }

    testLogging {
        for (def level : LogLevel.values())
        {
            def testLogging = get(level)
            testLogging.exceptionFormat = 'full'
            testLogging.events = ["FAILED", "STANDARD_OUT", "STANDARD_ERROR"]
        }
    }

    systemProperties(
        'java.util.logging.config.class': 'io.aeron.test.DisableJavaUtilLogging',
        'aeron.shared.idle.strategy': 'yield',
        'aeron.conductor.idle.strategy': 'yield',
        'aeron.sender.idle.strategy': 'yield',
        'aeron.receiver.idle.strategy': 'yield',
        'aeron.use.windows.high.res.timer': 'true',
        'aeron.timer.interval': '100ms',
        'aeron.dir.delete.on.start': 'true',
        'aeron.term.buffer.sparse.file': 'true',
        'aeron.perform.storage.checks': 'false',
        'agrona.disable.bounds.checks': 'false',
        'agrona.strict.alignment.checks': 'true',
        'net.bytebuddy.experimental': 'true',
        'io.aeron.shadow.net.bytebuddy.experimental': 'true',
        'net.bytebuddy.safe': 'true',
        'io.aeron.shadow.net.bytebuddy.safe': 'true',
        'java.net.preferIPv4Stack': 'true',
        'aeron.fallback.logger': 'no_op',
        'aeron.additional.configuration.property': 'foobar',
        'aeron.test.system.aeronmd.path': System.getProperty('aeron.test.system.aeronmd.path'),
        'aeron.test.system.binding.remote.host': System.getProperty('aeron.test.system.binding.remote.host'),
        'aeron.test.system.binding.local.host': System.getProperty('aeron.test.system.binding.local.host'),
        'aeron.test.system.aeron.dir': System.getProperty('aeron.test.system.aeron.dir'),
        'aeron.test.system.ats.path': System.getProperty('aeron.test.system.ats.path'),
        'aeron.test.system.ats.conf.dir': System.getProperty('aeron.test.system.ats.conf.dir'),
        'aeron.test.system.ats.conf.file': System.getProperty('aeron.test.system.ats.conf.file'),
        'aeron.test.system.driver.await.counters': System.getProperty('aeron.test.system.driver.await.counters'),
        'aeron.test.system.persistentsubscription.printresults': System.getProperty('aeron.test.system.persistentsubscription.printresults'))

    javaLauncher.set(toolchainLauncher)
}

tasks.register('slowTest', Test) {
    group = 'verification'

    maxParallelForks = 1
    useJUnitPlatform {
        includeTags 'slow'
    }

    systemProperties(
        'aeron.event.cluster.log': 'all',
        'aeron.event.cluster.log.disable': 'CANVASS_POSITION,APPEND_POSITION,COMMIT_POSITION',
        'aeron.event.archive.log': 'all',
        'aeron.event.log': 'admin',
        'aeron.debug.timeout': '3600s',
        'aeron.event.log.reader.classname': 'io.aeron.logging.CollectingEventLogReaderAgent',
        'aeron.fallback.logger': 'no_op')
}

tasks.register('bindingsTest', Test) {
    group = 'verification'

    maxParallelForks = 1
    useJUnitPlatform {
        includeTags 'bindings'
    }

    systemProperty 'aeron.event.cluster.log', 'all'
    systemProperty 'aeron.event.cluster.log.disable', 'CANVASS_POSITION,APPEND_POSITION,COMMIT_POSITION'
    systemProperty 'aeron.event.archive.log', 'all'
    systemProperty 'aeron.event.log', 'admin'
    systemProperty 'aeron.debug.timeout', '3600s'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.logging.CollectingEventLogReaderAgent'
}

tasks.register('topologyTest', Test) {
    group = 'verification'
    maxParallelForks = 1
    useJUnitPlatform {
        includeTags 'topology'
    }

    systemProperty 'aeron.event.cluster.log', 'all'
    systemProperty 'aeron.event.cluster.log.disable', 'CANVASS_POSITION,APPEND_POSITION,COMMIT_POSITION'
    systemProperty 'aeron.event.archive.log', 'all'
    systemProperty 'aeron.event.log', 'admin'
    systemProperty 'aeron.debug.timeout', '3600s'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.logging.CollectingEventLogReaderAgent'
}

tasks.register('testJar', Jar) {
    dependsOn 'testClasses'
    archiveClassifier.set(base.archivesName.map { "test-${it}" })
    from sourceSets.test.output
}

configurations {
    tests
}

artifacts {
    tests testJar
}
