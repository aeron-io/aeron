import io.aeron.build.ValidateCExpectations

// Adds `validateCounterExpectations`, for modules with a C implementation of their @AeronCounter counters.
plugins {
    id 'aeron.annotation-tools'
}

tasks.register('validateCounterExpectations', ValidateCExpectations) {
    description = 'Checks the C sources against the counters declared with @AeronCounter.'
    group = 'verification'

    mainClass = 'io.aeron.counter.validation.ValidateCounterExpectationsTask'
    // The aeron-annotations processors write this file to javac's native header directory, so deriving the path from
    // compileJava also makes this task depend on it.
    infoFile = tasks.named('compileJava').flatMap { it.options.headerOutputDirectory.file('counter-info.dat') }
    sourceDir = layout.projectDirectory.dir('src/main/c')
}
