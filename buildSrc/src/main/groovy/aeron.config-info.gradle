import io.aeron.build.AeronConfigInfoExtension
import io.aeron.build.FilePathArgumentProvider

// Tasks that work from the configuration options and counters recorded by the aeron-annotations processors when the
// module is compiled: `generateConfigDoc`, plus opt-in validation of the module's C sources via `aeronConfigInfo`.
plugins {
    id 'java'
}

configurations {
    configInfoTool {
        canBeConsumed = false
    }
}

dependencies {
    configInfoTool project(':aeron-annotations')
}

// The processors write their .dat files to javac's native header directory, so deriving the path from compileJava
// also makes these tasks depend on it.
def infoDir = tasks.named('compileJava').flatMap { it.options.headerOutputDirectory }

extensions.create(
    'aeronConfigInfo',
    AeronConfigInfoExtension,
    tasks,
    configurations.configInfoTool,
    infoDir,
    providers.provider { layout.projectDirectory.dir('src/main/c') })

tasks.register('generateConfigDoc', JavaExec) {
    def configInfoFile = infoDir.map { it.file('config-info.dat') }
    def generatedDocFile = layout.buildDirectory.file('generated-doc/out.md')

    inputs.file(configInfoFile).withPathSensitivity(PathSensitivity.RELATIVE)
    outputs.file(generatedDocFile)

    mainClass.set('io.aeron.config.docgen.GenerateConfigDocTask')
    classpath = configurations.configInfoTool
    argumentProviders.add(new FilePathArgumentProvider(configInfoFile, generatedDocFile))
}
