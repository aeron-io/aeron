import io.aeron.build.BuildJavaVersion
import io.aeron.build.ExtractJavadocLinksTask

// Shared Javadoc configuration for every Aeron module, linking offline to the JDK and Agrona Javadoc.
plugins {
    id 'aeron.java-conventions'
}

def libs = extensions.getByType(VersionCatalogsExtension).named('libs')
int buildJavaVersion = BuildJavaVersion.major()
boolean isEarlyAccessJavaVersion = BuildJavaVersion.isEarlyAccess()

configurations {
    javadocLinks
}

dependencies {
    javadocLinks("org.agrona:agrona:${libs.findVersion('agrona').get().requiredVersion}:javadoc@jar")
}

// Package lists of the libraries in `javadocLinks`, so the Javadoc can link to their documentation without
// fetching it.
def extractJavadocLinks = tasks.register('extractJavadocLinks', ExtractJavadocLinksTask) {
    javadocJars.from(configurations.javadocLinks)
    artifacts.set(configurations.javadocLinks.incoming.artifacts.resolvedArtifacts)
    outputDir = layout.buildDirectory.dir('javadoc-links')
}

javadoc {
    inputs.files(extractJavadocLinks).withPathSensitivity(PathSensitivity.RELATIVE)
    configurations.javadocLinks.dependencies.each { library ->
        options.linksOffline(
            "https://www.javadoc.io/static/${library.group}/${library.name}/${library.version}/",
            layout.buildDirectory.dir("javadoc-links/${library.name}").get().asFile.absolutePath
        )
    }

    failOnError = true
    title = '<h1>Aeron</h1>'
    options.bottom = '<i>Copyright &#169; 2014-2025 Real Logic Limited. All Rights Reserved.</i>'
    options.encoding = 'UTF-8'
    options.docEncoding = 'UTF-8'
    options.charSet = 'UTF-8'

    if (isEarlyAccessJavaVersion) {
        options.links("https://download.java.net/java/early_access/jdk${buildJavaVersion}/docs/api/")
    }
    else {
        options.links("https://docs.oracle.com/en/java/javase/${buildJavaVersion}/docs/api/")
    }

    exclude 'io/aeron/archive/codecs/**'
    exclude 'io/aeron/cluster/codecs/**'
    exclude 'io/aeron/samples/**'
    exclude 'io/aeron/test/**'

    options.addStringOption('-release', java.sourceCompatibility.majorVersion)
    options.addBooleanOption('Werror', true)
    options.addBooleanOption('Xdoclint:all', true)
}
