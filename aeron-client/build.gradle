plugins {
    id 'aeron.java-conventions'
    id 'aeron.publishing'
    id 'aeron.config-info'
}

aeronConfigInfo.validateConfigExpectations()
aeronConfigInfo.validateCounterExpectations()

dependencies {
    api libs.agrona
    implementation project(':aeron-annotations')
    annotationProcessor project(':aeron-annotations')
    testImplementation project(':aeron-test-support')
    testImplementation libs.jackson.cbor
    javadocSource project(':aeron-annotations')
}

jar {
    manifest.attributes(
        'Automatic-Module-Name': 'io.aeron.client',
        'Implementation-Title': 'Aeron',
        'Implementation-Vendor': 'Adaptive Financial Consulting Limited',
        'Implementation-Version': project.version
    )
}

java {
    withSourcesJar()
    withJavadocJar()
}

publishing {
    publications {
        aeronClient(MavenPublication) {
            from components.java
        }
    }
}
