plugins {
    id 'com.gradleup.shadow'
}

dependencies {
    testImplementation project(':aeron-archive')
    testImplementation project(':aeron-test-support')
    testImplementation project(':aeron-samples')
    testImplementation project(path: ':aeron-archive', configuration: 'tests')
    testImplementation project(path: ':aeron-cluster')
    testImplementation libs.byteBuddy
    testImplementation libs.byteBuddy.agent
    testCompileOnly libs.findbugs.annotations
}

tasks.named('test').configure {
    systemProperty 'aeron.event.cluster.log', 'all'
    systemProperty 'aeron.event.cluster.log.disable', 'CANVASS_POSITION,APPEND_POSITION,COMMIT_POSITION'
    systemProperty 'aeron.event.archive.log', 'all'
    systemProperty 'aeron.event.log', 'admin'
    systemProperty 'aeron.debug.timeout', '3600s'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.logging.CollectingEventLogReaderAgent'
    exclude '**/DriverLoggingSystemTest.class'
}

tasks.register('driverLoggingSystemTest', Test) {
    group = 'verification'
    useJUnitPlatform()
    include '**/DriverLoggingSystemTest.class'
    systemProperty 'aeron.event.log', 'all'
    systemProperty 'aeron.event.log.render.data', 'true'
    systemProperty 'aeron.debug.timeout', '3600s'
    systemProperty 'aeron.event.log.reader.classname', 'io.aeron.logging.CollectingEventLogReaderAgent'
}

check.dependsOn 'driverLoggingSystemTest'

shadowJar {
    archiveClassifier.set('tests')
    from sourceSets.test.output
    configurations = [project.configurations.testRuntimeClasspath]

    duplicatesStrategy = DuplicatesStrategy.EXCLUDE // exclude duplicate files by default

    mergeServiceFiles('META-INF/services') // merge service files into a single file
    filesMatching('META-INF/**') {
        duplicatesStrategy = DuplicatesStrategy.INCLUDE
    }
    filesMatching('META-INF/LICENSE*') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
    filesMatching('META-INF/NOTICE') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }
}

javadoc.enabled = false
